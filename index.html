<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ASTRA — Living Town Simulator</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="c"></canvas>

      <div id="loader">
        <div class="loader-inner">
          <div class="loader-mark">A</div>
          <h1>ASTRA</h1>
          <p>Building a living town…</p>
          <div class="bar"><div id="bar-fill"></div></div>
          <span id="load-msg">Laying streets</span>
        </div>
      </div>

      <header id="hud" class="hidden">
        <div class="brand">
          <span class="mark">A</span>
          <div>
            <strong>ASTRA</strong>
            <em>3D town simulator</em>
          </div>
        </div>
        <div class="stats">
          <div><label>Time</label><b id="clock">07:30</b></div>
          <div><label>People</label><b id="people-count">0</b></div>
          <div><label>Vehicles</label><b id="car-count">0</b></div>
          <div><label>Weather</label><b id="weather">Clear</b></div>
        </div>
        <div class="modes" id="modes">
          <button type="button" data-mode="cinematic" class="active">Explore</button>
          <button type="button" data-mode="walk">Walk</button>
          <button type="button" data-mode="drive">Drive</button>
        </div>
      </header>

      <aside id="panel" class="hidden">
        <label>Day cycle <span id="speed-label">x8</span></label>
        <input id="time-speed" type="range" min="0" max="60" value="8" />
        <label>Hour</label>
        <input id="hour" type="range" min="0" max="24" step="0.05" value="8.5" />
        <button type="button" id="reset-view">Reset view</button>
      </aside>

      <div id="gesture-hint">
        <b>Drag</b> look · <b>Pinch</b> zoom · <b>Two fingers</b> pan
      </div>

      <div id="joystick" class="hidden">
        <div class="stick-base">
          <div class="stick-knob"></div>
        </div>
        <span id="joy-label">Move</span>
      </div>

      <div id="look-hint" class="hidden">Drag here to look</div>

      <div id="crosshair" class="hidden"></div>
      <div id="toast"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

name: AURA Build & Test

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    name: Build, test, package APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null || true
          yes | sdkmanager --licenses >/dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Compile & run JVM tests (capture log)
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :core:test --stacktrace 2>&1 | tee /tmp/compile.log
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee -a /tmp/compile.log

      - name: Assemble debug APK (capture log)
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee /tmp/assembleDebug.log

      - name: Generate release signing key (CI-only, self-signed)
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.jks" \
            -alias aura \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass changeme -keypass changeme \
            -dname "CN=AURA Orchestrator, OU=Aura, O=Aura, L=City, ST=State, C=US"

      - name: Assemble signed release APK (capture log)
        shell: bash
        env:
          AURA_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          AURA_KEYSTORE_PASSWORD: changeme
          AURA_KEY_ALIAS: aura
          AURA_KEY_PASSWORD: changeme
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee /tmp/assembleRelease.log

      - name: Commit build log back to branch (on failure)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set +e
          for f in /tmp/compile.log /tmp/assembleDebug.log /tmp/assembleRelease.log; do
            [ -f "$f" ] && cat "$f"
          done > /tmp/all.log
          [ -s /tmp/all.log ] || exit 0
          mkdir -p ci
          {
            echo "### Build log — run ${GITHUB_RUN_ID} $(date -u)"
            echo '```'
            grep -aE "e: |error:|FAILURE:|What went wrong|Caused by:|Unresolved reference|cannot find|could not|not found|Exception|> Task .* FAILED|Execution failed|Warning:.*(missing|rule)|Type .* is missing|R8" /tmp/all.log | head -300
            echo '```'
          } > ci/build-log.md
          git config user.email "ci-bot@users.noreply.github.com"
          git config user.name "ci-bot"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git add ci/build-log.md
          git commit -m "ci: build log [skip ci]" >/dev/null 2>&1 || exit 0
          git push origin "HEAD:${BRANCH}" >/dev/null 2>&1 || echo "push failed"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aura-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aura-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/**
            app/build/reports/tests/**

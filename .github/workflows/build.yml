name: AURA Build & Test

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    name: Build, test, package APK
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null || true
          yes | sdkmanager --licenses >/dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Compile & run JVM tests (capture log)
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :core:test --stacktrace 2>&1 | tee /tmp/build.log
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee -a /tmp/build.log

      - name: Publish compile errors to an issue (on failure)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          {
            echo "## AURA CI build failed ($(date -u +%Y-%m-%dT%H:%MZ))"
            echo
            echo '```'
            grep -aE "e: |error:|FAILURE:|What went wrong|Caused by:|Unresolved reference|cannot|> Task .* FAILED|Could not|Exception" /tmp/build.log | head -400
            echo '```'
          } > /tmp/body.md
          gh issue create --title "AURA CI build failure" --body-file /tmp/body.md --label "ci-fail" >/dev/null 2>&1 || \
            gh issue create --title "AURA CI build failure" --body-file /tmp/body.md >/dev/null 2>&1 || true

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Generate release signing key (CI-only, self-signed)
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.jks" \
            -alias aura \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass changeme -keypass changeme \
            -dname "CN=AURA Orchestrator, OU=Aura, O=Aura, L=City, ST=State, C=US"

      - name: Assemble signed release APK
        env:
          AURA_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          AURA_KEYSTORE_PASSWORD: changeme
          AURA_KEY_ALIAS: aura
          AURA_KEY_PASSWORD: changeme
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/**
            app/build/reports/tests/**
